</style></head><body><div id="world"></div><div id="intro" class="screen"><div class="intro"><div class="eyebrow">OFFLINE SOLO PLAYTEST</div><h1>SKY PATCH ✦</h1><h2>补天派对</h2><h3>天空破了一个洞。<br>来把月亮弹回去。</h3><p>放下弹垫，踢动月亮，送到金色目标。</p><p>单人离线试玩 · 推荐平板横屏</p><button class="mainbtn" id="start">开始离线试玩 ↗</button><p class="fine">重新制作的早期原型 · 暂不支持多人 · 美术为临时素材</p></div></div><div id="hud" class="hidden"><div class="top"><div class="brand">✦ 补天派对<small>SKY PATCH / PLAYTEST</small></div><div class="stats"><div><span>修补进度</span><b id="score">00</b></div><div><span>剩余时间</span><b id="time">02:30</b></div></div></div><div class="tip"><strong>↗ 把月亮送回天空</strong><span id="hint">先放垫，走近月亮按踢球！</span></div><div class="status" id="status">● 等待弹垫接住月亮</div><div class="controls"><div class="dpad"><button class="control up" data-dir="up" aria-label="向前">▲</button><button class="control left" data-dir="left" aria-label="向左">◀</button><button class="control down" data-dir="down" aria-label="向后">▼</button><button class="control right" data-dir="right" aria-label="向右">▶</button></div><div class="actions"><button class="control" data-action="jump">跳</button><button class="control pad" data-action="pad">放垫</button><button class="control kick" data-action="kick">踢球</button></div></div><div class="foot">EARLY BUILD · 临时美术 · 单人离线</div></div><div id="end" class="screen hidden"><div><div class="eyebrow">NICE PATCHING!</div><h2>天空修补完成</h2><h3 id="result"></h3><p>再试一次，看看能不能创造新纪录。</p><button class="mainbtn" id="restart">再玩一次 ↗</button></div></div><script>__SCRIPT__</script></body></html>
