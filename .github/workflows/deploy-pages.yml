name: Deploy Permanent Global Site to GitHub Pages

on:
  push:
    branches:
      - "arena/7bd6cc32-ai-website-cloner-template"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test game protocol and rule links
        run: |
          npm run test:party
          node --test tests/veil.test.mjs

      - name: Build Static Bundle for GitHub Pages
        env:
          GITHUB_PAGES: "1"
        run: |
          npm run build
          cp -r site/slabai out/slabai
          cp -r site/reunion out/reunion
          cp -r site/petdaily out/petdaily
          cp -r site/landed out/landed
          touch out/.nojekyll

      - name: Browser smoke test (desktop and mobile)
        run: node tests/veil.browser.cjs

      - name: Publish Static Bundle to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
