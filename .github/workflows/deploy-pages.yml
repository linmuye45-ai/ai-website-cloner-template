name: Deploy Permanent Global Site to GitHub Pages

on:
  push:
    branches:
      - master
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Zero-Server Static Bundle for GitHub Pages
        env:
          STATIC_EXPORT: "1"
          GITHUB_PAGES_BASE_PATH: "/ai-website-cloner-template"
        run: |
          npm run build
          touch out/.nojekyll

      - name: Publish Static Bundle to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
