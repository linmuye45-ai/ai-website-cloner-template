name: CI

on:
  push:
    branches:
      - master
      - vesti-platform
  pull_request:
    branches:
      - master
      - vesti-platform

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Production dependency audit
        run: npm run audit
      - name: Build
        run: npm run build
