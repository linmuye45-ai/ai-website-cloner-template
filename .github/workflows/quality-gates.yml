name: quality-gates

on:
  push:
    branches:
      - ops/platform-independence-20261128
  pull_request:
    branches:
      - nexora
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Lint, types, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Reconcile package manifest and lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Persist lockfile refresh on the ops branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/ops/platform-independence-20261128'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add reproducible npm lockfile"
            git push
          fi

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
